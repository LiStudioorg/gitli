# SPDX-License-Identifier: AGPL-3.0
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
  settings:
    staticcheck:
      checks:
        - all
        # ST1000: 每个文件首行为 SPDX 标识，包注释只需在包内一个文件提供。
        - -ST1000
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/LiStudioorg/gitli
