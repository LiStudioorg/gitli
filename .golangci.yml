# SPDX-License-Identifier: AGPL-3.0
run:
  timeout: 3m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/LiStudioorg/gitli

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
