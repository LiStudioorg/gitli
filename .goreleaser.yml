# SPDX-License-Identifier: AGPL-3.0
# GoReleaser 配置：编译 + 打包 + 发布（免费版全能路径）。
version: 2

project_name: gitli

before:
  hooks:
    - go mod tidy

builds:
  - id: gitli
    binary: gitli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/LiStudioorg/gitli/internal/version.version={{.Version}}
      - -X github.com/LiStudioorg/gitli/internal/version.commit={{.Commit}}
      - -X github.com/LiStudioorg/gitli/internal/version.date={{.Date}}
      - -X github.com/LiStudioorg/gitli/internal/version.builtBy=goreleaser
    # 显式列出 all supported targets（modernc.org/sqlite 不支持部分平台）。
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_7
      - linux_386
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - windows_386
      - freebsd_amd64
      - freebsd_arm64
      - freebsd_386
      - freebsd_arm_7
      - openbsd_amd64
      - openbsd_arm64
      - netbsd_amd64

archives:
  - id: gitli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.toml

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

sboms:
  - artifacts: archive

nfpms:
  - id: gitli
    package_name: gitli
    vendor: LiStudioorg
    homepage: https://github.com/LiStudioorg/gitli
    maintainer: li63050a <li63050@foxmail.com>
    description: Lightweight self-hosted Git service platform.
    license: AGPL-3.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin
    contents:
      - src: config.example.toml
        dst: /etc/gitli/config.example.toml
        type: config
      - src: deploy/systemd/gitli.service
        dst: /lib/systemd/system/gitli.service


release:
  github:
    owner: LiStudioorg
    name: gitli
  draft: false
  prerelease: auto
  name_template: "gitli {{ .Version }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
