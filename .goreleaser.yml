# SPDX-License-Identifier: AGPL-3.0
# GoReleaser 配置：编译 + 打包 + 发布（免费版全能路径）。
version: 2

project_name: gitli

before:
  hooks:
    - go mod tidy

builds:
  - id: gitli
    binary: gitli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/LiStudioorg/gitli/internal/version.version={{.Version}}
      - -X github.com/LiStudioorg/gitli/internal/version.commit={{.Commit}}
      - -X github.com/LiStudioorg/gitli/internal/version.date={{.Date}}
      - -X github.com/LiStudioorg/gitli/internal/version.builtBy=goreleaser
    # 显式列出 all supported targets（modernc.org/sqlite 不支持部分平台）。
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_7
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

archives:
  - id: gitli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.toml

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

nfpms:
  - id: gitli
    package_name: gitli
    vendor: LiStudioorg
    homepage: https://github.com/LiStudioorg/gitli
    maintainer: li63050a <li63050@foxmail.com>
    description: Lightweight self-hosted Git service platform.
    license: AGPL-3.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin
    contents:
      - src: config.example.toml
        dst: /etc/gitli/config.example.toml
        type: config
      - src: deploy/systemd/gitli.service
        dst: /lib/systemd/system/gitli.service


release:
  github:
    owner: LiStudioorg
    name: gitli
  draft: false
  prerelease: auto
  name_template: "gitli {{ .Version }}"
  header: |
    ## 本次亮点

    - 🔒 **包含 v0.10.1 的全部高危安全修复**：Git 归档参数注入、CI 日志匿名越权、
      systemd 硬编码主密钥、CI 产物越权删除、OAuth 回调协议校验、X-Forwarded-For 信任、
      停用账号绕过、密码爆破、RBAC 越权、Webhook SSRF 等。
    - ✨ 新增：生产级文本日志格式（带处理函数 `file:line(func)` 定位、终端颜色高亮、
      慢请求自动升级为 WARN/ERROR），并保留 `format = "json"` 供日志采集。
    - ✨ 新增：优雅停机，重启/停止时等待在途 Git 传输完成（最长 10 秒），不再中断用户。
    - ✨ 新增：启动横幅（版本 / Go 版本 / 运行模式 / 配置路径 / 数据目录 / Git 版本）
      与弱密钥自动检测（拒绝公开示例值与低熵密钥）。

    > 升级提示：若你曾使用旧 systemd 模板中的示例密钥，请重新生成
    > `GITLI_CRYPTO_KEY` / `GITLI_PEPPER`，并重置 2FA 与 CI Secrets。

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
