{{define "content"}}
<h1>新建组织</h1>
{{template "flash" .Data}}
<form method="post" action="/orgs/create">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>组织名 <input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_.-]*"></label>
  <label>描述 <input name="description"></label>
  <button type="submit">创建</button>
</form>
{{end}}
