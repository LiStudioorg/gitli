{{define "content"}}
{{template "repoheader" .Data.Repo}}

<h2>分支</h2>
<table class="ref-table">
  <tbody>
  {{range .Data.Branches}}
    <tr>
      <td><a href="/{{$.Data.Repo.OwnerName}}/{{$.Data.Repo.RepoName}}/tree/{{.Name}}"><strong>{{.Name}}</strong></a></td>
      <td><a href="/{{$.Data.Repo.OwnerName}}/{{$.Data.Repo.RepoName}}/commits/{{.Name}}">提交历史</a></td>
      <td class="muted"><code>{{printf "%.10s" .SHA}}</code></td>
      <td class="muted">{{timefmt .Date}}</td>
    </tr>
  {{else}}
    <tr><td class="muted">暂无分支</td></tr>
  {{end}}
  </tbody>
</table>

<h2>标签</h2>
<table class="ref-table">
  <tbody>
  {{range .Data.Tags}}
    <tr>
      <td><a href="/{{$.Data.Repo.OwnerName}}/{{$.Data.Repo.RepoName}}/tree/{{.Name}}"><strong>{{.Name}}</strong></a></td>
      <td><a href="/{{$.Data.Repo.OwnerName}}/{{$.Data.Repo.RepoName}}/commits/{{.Name}}">提交历史</a></td>
      <td class="muted"><code>{{printf "%.10s" .SHA}}</code></td>
      <td class="muted">{{timefmt .Date}}</td>
    </tr>
  {{else}}
    <tr><td class="muted">暂无标签</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
